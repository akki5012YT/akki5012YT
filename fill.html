<!doctype html>
<meta charset=utf-8>
<title>fill</title>
<body>
<p id=s>0</p>
<script>
const N=500, D=50;
const b = location.href.split('?')[0];
const i = +(new URLSearchParams(location.search).get('i')||0);
document.getElementById('s').textContent = i+'/'+N;
if (i < N) setTimeout(()=>location.href = b+'?i='+(i+1), D);
else document.getElementById('s').textContent = 'done';
</script>
